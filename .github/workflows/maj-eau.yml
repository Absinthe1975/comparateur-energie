name: Mise à jour du prix de l'eau

on:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi : prend la dernière année SISPEA disponible (aucune demande si rien ne change)
  workflow_dispatch:

concurrency:
  group: maj-eau
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  eau:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas xlrd openpyxl
      - run: python3 -m unittest tests.test_eau_maj tests.test_eau_historique tests.test_eau_classement
      - name: Historique du prix de l'eau (toutes les années SISPEA disponibles)
        continue-on-error: true
        run: python3 scripts/eau_historique.py
      - name: Télécharger et reconstruire eau/cp
        run: python3 scripts/eau_maj.py
      - name: Classement des communes les moins chères par région
        run: python3 scripts/eau_classement.py
      - name: Ouvrir la demande de fusion
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: maj-eau
          title: "Prix de l'eau : mise à jour SISPEA"
          commit-message: "Prix de l'eau : mise à jour automatique (SISPEA + La Poste)"
          body: "Mise à jour automatique des fichiers eau/cp et eau/historique. Les garde-fous (perte de codes postaux, écart de prix) ont été passés. À relire puis fusionner."
          add-paths: |
            donnees/eau/cp
            donnees/eau/classement.json
            donnees/eau/historique
          assignees: Absinthe1975
          reviewers: Absinthe1975
          labels: à-fusionner
      - name: Fusionner tout de suite (tests et garde-fous déjà passés ici, sans validation manuelle)
        # Les PR ouvertes par le robot voient leurs tests « en attente d'approbation » : on ne les attend pas.
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          N: ${{ steps.cpr.outputs.pull-request-number }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          gh pr merge "$N" --repo "$REPO" --merge --match-head-commit "$SHA" && echo "::notice::PR #$N fusionnée automatiquement." || echo "::warning::PR #$N : fusion automatique impossible, à fusionner à la main."
