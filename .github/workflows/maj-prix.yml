name: Mise à jour des prix

on:
  schedule:
    - cron: "0 6 1-10 * *"  # chaque jour du 1er au 10 (publication du prix repère, changements des fournisseurs), 6 h UTC
    - cron: "0 6 * * 1"     # puis chaque lundi pour rattraper un changement en cours de mois
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
    inputs:
      recoupement:
        description: "Recouper aussi les prix inchangés sur un second site (complet, mais bien plus long : le lundi, c'est automatique)"
        type: boolean
        default: false

concurrency:
  group: maj-prix
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation de pypdf et openpyxl (lecture des PDF et des fichiers Excel de la CRE)
        run: pip install pypdf openpyxl
      - name: Tests du script
        run: python -m unittest discover -s tests
      - name: Lecture des pages et extraction par l'IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: gemini
          CROSSCHECK: ${{ (inputs.recoupement || github.event.schedule == '0 6 * * 1') && '1' || '' }}
          LLM_DELAY: "4"
          FETCH_DELAY: "1"
          CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: python scripts/update_prices.py
      - name: Contrôle de data.json
        run: python scripts/check_data.py
      - name: Historique des prix (séries officielles de la CRE et relevés des offres)
        continue-on-error: true
        run: python scripts/historique.py
      - name: Vérification des liens fournisseur (n'empêche jamais la mise à jour)
        continue-on-error: true
        run: python scripts/check_liens.py
      - name: Y a-t-il quelque chose à relire ?
        id: chg
        run: |
          git status --short
          if grep -q "^## Changements appliqués (0)" report.md && grep -q "^## À relire : valeur proposée mais non appliquée (0)" report.md && [ -z "$(git status --porcelain -- donnees/elec/historique.json donnees/gaz/historique.json donnees/elec/historique-offres.json donnees/gaz/historique-offres.json)" ]; then
            echo "open=false" >> "$GITHUB_OUTPUT"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ouvrir une demande de fusion à relire
        if: steps.chg.outputs.open == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: maj-prix
          title: "Mise à jour des prix à relire"
          commit-message: "Mise à jour des prix (script + IA)"
          body-path: report.md
          assignees: Absinthe1975
          reviewers: Absinthe1975
          labels: à-fusionner
          add-paths: |
            donnees/data.json
            donnees/elec/*.json
            donnees/gaz/*.json
            donnees/etat/hashes.json
            donnees/gaz/prix-cp/*.json
          delete-branch: true
