name: Mise à jour des prix

on:
  schedule:
    # Minutes « creuses » (pas :00 ni :30) : GitHub retarde ou saute plus souvent les tâches lancées pile à l'heure.
    - cron: "23 7 1-10 * *"  # chaque jour du 1er au 10 (prix repère, changements des fournisseurs), 7 h 23 UTC
    - cron: "41 14 1-10 * *" # second passage l'après-midi : rattrape un passage sauté ou une publication tardive (les pages inchangées sont ignorées)
    - cron: "17 7 * * 1"     # puis chaque lundi pour rattraper un changement en cours de mois (avec recoupement)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
    inputs:
      recoupement:
        description: "Recouper aussi les prix inchangés sur un second site (complet, mais bien plus long : le lundi, c'est automatique)"
        type: boolean
        default: false

concurrency:
  group: maj-prix
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation de pypdf et openpyxl (lecture des PDF et des fichiers Excel de la CRE)
        run: pip install pypdf openpyxl
      - name: Tests du script
        run: python -m unittest discover -s tests
      - name: Lecture des pages et extraction par l'IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: gemini
          CROSSCHECK: ${{ (inputs.recoupement || github.event.schedule == '17 7 * * 1') && '1' || '' }}
          LLM_DELAY: "4"
          FETCH_DELAY: "1"
          CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: python scripts/update_prices.py
      - name: Contrôle de data.json
        run: python scripts/check_data.py
      - name: Historique des prix (séries officielles de la CRE et relevés des offres)
        continue-on-error: true
        run: python scripts/historique.py
      - name: Vérification des liens fournisseur (n'empêche jamais la mise à jour)
        continue-on-error: true
        run: python scripts/check_liens.py
      - name: Y a-t-il quelque chose à relire ?
        id: chg
        run: |
          git status --short
          if grep -q "^## Changements appliqués (0)" report.md && grep -q "^## À relire : valeur proposée mais non appliquée (0)" report.md && [ -z "$(git status --porcelain -- donnees/elec/historique.json donnees/gaz/historique.json donnees/elec/historique-offres.json donnees/gaz/historique-offres.json)" ]; then
            echo "open=false" >> "$GITHUB_OUTPUT"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ouvrir une demande de fusion à relire
        if: steps.chg.outputs.open == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: maj-prix
          title: "Mise à jour des prix à relire"
          commit-message: "Mise à jour des prix (script + IA)"
          body-path: report.md
          assignees: Absinthe1975
          reviewers: Absinthe1975
          labels: à-fusionner
          add-paths: |
            donnees/data.json
            donnees/elec/*.json
            donnees/gaz/*.json
            donnees/etat/hashes.json
            donnees/gaz/prix-cp/*.json
          delete-branch: true
      - name: Fusionner tout de suite (tests + relecture déjà faits ici, sans validation manuelle)
        # Les PR ouvertes par le robot voient leurs tests « en attente d'approbation » : on ne les attend pas.
        # Les tests unitaires et check_data.py ont tourné plus haut ; la relecture automatique décide ensuite.
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          N: ${{ steps.cpr.outputs.pull-request-number }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          BRANCHE: maj-prix
        run: |
          set -uo pipefail
          git fetch -q --unshallow origin 2>/dev/null || git fetch -q origin
          git fetch -q origin main "$SHA"
          if python3 scripts/relecture.py "$(git merge-base origin/main "$SHA")" "$SHA" /tmp/relecture.md; then
            # La règle de protection de main exige le contrôle « tests ». Les tests d'une PR du robot restent « en attente
            # d'approbation » : on lance donc le workflow Tests à la main sur la branche (même commit), on attend son résultat, puis on fusionne.
            gh workflow run tests.yml --repo "$REPO" --ref "$BRANCHE"
            ID=""
            for i in $(seq 1 30); do
              sleep 10
              ID=$(gh run list --repo "$REPO" --workflow tests.yml --branch "$BRANCHE" --event workflow_dispatch --limit 5 --json databaseId,headSha --jq "[.[]|select(.headSha==\"$SHA\")][0].databaseId // empty")
              [ -n "$ID" ] && break
            done
            if [ -z "$ID" ]; then echo "::warning::Tests non lancés : PR #$N à fusionner à la main."; exit 0; fi
            if ! gh run watch "$ID" --repo "$REPO" --exit-status >/dev/null; then echo "::warning::Tests en échec : PR #$N non fusionnée."; exit 0; fi
            gh pr merge "$N" --repo "$REPO" --merge --match-head-commit "$SHA" && {
              echo "::notice::PR #$N fusionnée automatiquement."
              sleep 5
              gh workflow run facebook.yml --repo "$REPO" --ref main || echo "::warning::Lancement de la publication Facebook impossible."
            }
          else
            gh label create ne-pas-fusionner --repo "$REPO" --color B60205 --description "Fusion automatique suspendue" 2>/dev/null || true
            gh pr edit "$N" --repo "$REPO" --add-label ne-pas-fusionner || true
            gh pr comment "$N" --repo "$REPO" --body-file /tmp/relecture.md || true
            echo "::warning::PR #$N : relecture à regarder, pas de fusion."
          fi
